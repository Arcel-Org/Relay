# Pull-based override for clone-free deployment from prebuilt images.
#
# Use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
# (scripts/quickstart.sh fetches both files and runs exactly this.)
#
# This replaces `build:` from source with a pull of the published image, so
# deploying never requires the repo, Node.js, or a local compile. The image is
# URL-agnostic: NEXT_PUBLIC_RELAY_URL is injected at RUNTIME (the root layout
# sets <html data-relay-url> from the container env, which the client prefers
# over the baked value), so changing the public URL is a restart, not a rebuild.
#
# `build: !reset null` removes the base service's build block during the
# Compose merge, so `up` pulls the image instead of building it. There is no
# `pull_policy` here: `up` uses a locally-present image, and quickstart.sh /
# the update flow run an explicit `docker compose pull` to refresh to the
# latest published image.
#
# RELAY_IMAGE lets you pin a specific version, e.g.
#   RELAY_IMAGE=ghcr.io/arcel-org/relay:v0.1.0
services:
  app:
    build: !reset null
    image: ${RELAY_IMAGE:-ghcr.io/arcel-org/relay:latest}
  relay:
    build: !reset null
    image: ${RELAY_IMAGE:-ghcr.io/arcel-org/relay:latest}
