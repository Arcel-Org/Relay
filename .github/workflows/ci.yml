name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default for the ambient GITHUB_TOKEN — this workflow only
# checks out the repo, lints, type-checks, tests, and builds; it never
# writes anything back. Without an explicit permissions block, jobs inherit
# whatever the repository/org default grants, which can be much broader
# (write access to contents, PRs, etc.) than anything this workflow needs.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production-dependency vulnerability scan (not --omit=dev — dev-only
      # tooling like eslint never runs against attacker-controlled input, so
      # a broad devDependency advisory chain would just make this noisy
      # without protecting anything actually shipped; see the accepted
      # eslint-toolchain gap this excludes, documented where postcss/tar were
      # fixed). --audit-level=high means a new low/moderate advisory doesn't
      # block CI, but this would have caught the real postcss/tar CVEs this
      # repo shipped with, automatically, the day they were disclosed.
      - name: Dependency audit (production only)
        run: npm audit --omit=dev --audit-level=high

      # Runs the gitleaks CLI directly (not a marketplace action) against
      # the full repo history, redacting matches from the log; --exit-code 1
      # fails the job on any NEW finding not already in
      # .gitleaks-baseline.json (see that file's own note — it exists only
      # to baseline pre-existing, already-reviewed history, not to hide
      # anything going forward).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Verify against gitleaks' own published checksum before extracting
          # and executing anything — a version pin alone doesn't stop a
          # substituted release asset (compromised CDN, MITM, compromised
          # release process) from being piped straight into `tar` and then
          # run. Checksum from gitleaks_8.30.1_checksums.txt, re-verify when
          # bumping the version.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1 --baseline-path .gitleaks-baseline.json

      # `next lint` was removed in Next.js 16; `npm run lint` now runs
      # `eslint .` directly via a flat eslint.config.mjs. ~80 pre-existing
      # findings from eslint-config-next 16's stricter react-hooks rules are
      # deliberately downgraded to warnings there (not fixed in one blind
      # pass across security-sensitive hooks, not silenced either) — see
      # eslint.config.mjs's own comment for exactly which rules and why.
      # This step still fails the build on anything left at error severity.
      - name: Lint
        run: npm run lint

      - name: Type-check (app)
        run: npx tsc --noEmit -p tsconfig.json

      # The app tsconfig (bundler resolution, allowImportingTsExtensions)
      # does not catch errors specific to the server build (CommonJS
      # resolution, allowImportingTsExtensions: false) — this is the actual
      # production compile path for the relay (see Dockerfile's build:relay
      # step), and without checking it separately a change that breaks the
      # relay's build can pass every other CI step and only fail once the
      # Docker image is built at deploy time.
      - name: Type-check (server)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Test
        run: npm test

      - name: Build (app)
        run: npm run build

      - name: Build (relay)
        run: npm run build:relay

      - name: Shellcheck deploy scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './scripts'
