name: publish-image

# Builds the prebuilt Relay image (used by scripts/quickstart.sh for the
# clone-free path) and publishes it to GHCR, scoped to THIS repository via the
# ambient GITHUB_TOKEN. A repo-scoped GHCR package inherits the repository's
# visibility — so once the repo is public the pull-only quickstart works for
# anyone without Docker auth.
#   ghcr.io/{owner}/relay:latest   (always the latest master build)
#   ghcr.io/{owner}/relay:v0.1.0   (when a v* tag is pushed)
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    # Manual re-publish ("Run workflow" in the Actions tab) without a code change.

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relay"
          TAGS="${IMG}:latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMG}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Relay is URL-agnostic at runtime (RELAY_WS_URL), so the image is built
      # once with a placeholder NEXT_PUBLIC_RELAY_URL; the real public wss://
      # origin is injected per-deploy from the container env.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: NEXT_PUBLIC_RELAY_URL=wss://relay.invalid
          tags: ${{ steps.tags.outputs.tags }}
