name: publish-image

# Builds the prebuilt Relay image (used by scripts/quickstart.sh for the
# clone-free path) and publishes it to GHCR, scoped to THIS repository via the
# ambient GITHUB_TOKEN. A repo-scoped GHCR package inherits the repository's
# visibility — so once the repo is public the pull-only quickstart works for
# anyone without Docker auth.
#   ghcr.io/{owner}/relay:latest   (always the latest master build)
#   ghcr.io/{owner}/relay:v0.1.0   (when a v* tag is pushed)
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4fd96898e3d8b553a3b7eb3b8b5e3cf1f9d8c1e2 # v3

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relay"
          TAGS="${IMG}:latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMG}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Relay is URL-agnostic at runtime (RELAY_WS_URL), so the image is built
      # once with a placeholder NEXT_PUBLIC_RELAY_URL; the real public wss://
      # origin is injected per-deploy from the container env.
      - name: Build and push image
        uses: docker/build-push-action@0524c53e31a1e3356f6077b1eac4d6b8d8a24e4c # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: NEXT_PUBLIC_RELAY_URL=wss://relay.invalid
          tags: ${{ steps.tags.outputs.tags }}
