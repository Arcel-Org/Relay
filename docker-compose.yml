# Relay — self-hosted post-quantum encrypted messaging.
#   docker compose up -d                    # app (:3000) + relay (:8080)
#   docker compose --profile turn up -d     # + coturn for call media (optional)
# Secrets come from .env — generate via scripts/quickstart.sh (or setup.sh).
# Both ports bind to loopback; put a TLS-terminating reverse proxy in front.
# Docs: docs/DEPLOY.md

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?set NEXT_PUBLIC_RELAY_URL in .env (docs/DEPLOY.md §2)}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [default, proxy-net]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    environment:
      NODE_ENV: production
      PORT: "3000"
      RELAY_HOST: relay
      RELAY_PORT: "8080"
      NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL}
      RELAY_WS_URL: ${NEXT_PUBLIC_RELAY_URL}
    env_file: .env
    volumes:
      - app-data:/app/.data
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?set NEXT_PUBLIC_RELAY_URL in .env (docs/DEPLOY.md §2)}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, proxy-net]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    environment:
      NODE_ENV: production
      RELAY_PORT: "8080"
    env_file: .env
    volumes:
      - app-data:/app/.data
    command: ["node", "dist-server/server/relay-node.js"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  coturn:
    # Optional TURN server for call media relay (needs TURN_SECRET in .env)
    image: coturn/coturn@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -n "$$TURN_SECRET" || { echo "TURN_SECRET not set in .env" >&2; exit 1; }
        conf=$$(mktemp)
        printf 'use-auth-secret\nstatic-auth-secret=%s\nrealm=relay\nno-cli\nmin-port=49152\nmax-port=49200\nlog-file=stdout\n' "$$TURN_SECRET" > "$$conf"
        chmod 600 "$$conf"
        exec turnserver -c "$$conf"

volumes:
  app-data:

networks:
  # Create once if your reverse proxy runs as a container: docker network create proxy-net
  proxy-net:
    external: true
