# Relay — self-hosted post-quantum encrypted messaging.
#
#   docker compose up -d
#   docker compose up -d -f docker-compose.turn.yml   # + coturn for calls (optional)
#
# Runs from the published image (clone-free). To build from source instead,
# add -f docker-compose.source.yml. Secrets come from .env — generate via
# scripts/quickstart.sh (or setup.sh). Ports bind to loopback; put a
# TLS-terminating reverse proxy in front. Docs: docs/DEPLOY.md

services:
  app:
    image: ${RELAY_IMAGE:-ghcr.io/arcel-org/relay:latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-data:/app/.data
    networks: [default, proxy-net]
    ports:
      - "127.0.0.1:3000:3000"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      NODE_ENV: production
      PORT: "3000"
      RELAY_HOST: relay
      RELAY_PORT: "8080"
      NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL}
      RELAY_WS_URL: ${NEXT_PUBLIC_RELAY_URL}
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    image: ${RELAY_IMAGE:-ghcr.io/arcel-org/relay:latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-data:/app/.data
    networks: [default, proxy-net]
    ports:
      - "127.0.0.1:8080:8080"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      NODE_ENV: production
      RELAY_PORT: "8080"
    command: ["node", "dist-server/server/relay-node.js"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:

networks:
  proxy-net:
    external: true
