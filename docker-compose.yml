# Relay — self-hosted post-quantum encrypted messaging.
#   docker compose up -d                          # app (:3000) + relay (:8080)
#   docker compose -f docker-compose.turn.yml up -d   # + coturn for calls (optional)
# Secrets come from .env — generate via scripts/quickstart.sh (or setup.sh).
# Both ports bind to loopback; put a TLS-terminating reverse proxy in front.
# Docs: docs/DEPLOY.md

x-common: &common
  restart: unless-stopped
  env_file: .env
  volumes:
    - app-data:/app/.data
  networks: [default, proxy-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  deploy:
    resources:
      limits: { cpus: "2", memory: 2G }

services:
  app:
    <<: *common
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?set NEXT_PUBLIC_RELAY_URL in .env (docs/DEPLOY.md §2)}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      RELAY_HOST: relay
      RELAY_PORT: "8080"
      NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL}
      RELAY_WS_URL: ${NEXT_PUBLIC_RELAY_URL}
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    <<: *common
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?set NEXT_PUBLIC_RELAY_URL in .env (docs/DEPLOY.md §2)}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      RELAY_PORT: "8080"
    command: ["node", "dist-server/server/relay-node.js"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:

networks:
  proxy-net:
    external: true
