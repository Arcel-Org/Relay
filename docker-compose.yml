# Relay — self-hosted post-quantum encrypted messaging.
#
#   docker compose up -d                          # app (:3000) + relay (:8080)
#   docker compose --profile turn up -d           # + coturn (call media relay)
#
# Secrets come from .env — generate it with scripts/quickstart.sh (image
# path) or scripts/setup.sh (source path); both are idempotent.
#
# Key facts:
#   • Both ports bind to loopback only. Put a TLS-terminating reverse proxy
#     in front (nginx / Caddy / Cloudflare). If the proxy is itself a
#     container, create the shared network once — `docker network create
#     proxy-net` — join it, and point at `app:3000` / `relay:8080` by name.
#   • NEXT_PUBLIC_RELAY_URL is baked into the client bundle at build time, so
#     set it to the PUBLIC wss:// URL browsers can reach (never the internal
#     `relay:8080` name). The runtime RELAY_WS_URL override lets a prebuilt
#     image resolve the URL without a rebuild.
#   • app and relay share one image; `command` swaps in the relay entrypoint.
#
# Full guide: docs/DEPLOY.md.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?Set NEXT_PUBLIC_RELAY_URL in .env (see docs/DEPLOY.md §2)}
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [default, proxy-net]
    ulimits: &ulimits
      nofile:
        soft: 65536
        hard: 65536
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      NODE_ENV: production
      RELAY_WS_URL: ${NEXT_PUBLIC_RELAY_URL}   # runtime URL for prebuilt images
      NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL}
      # Pinned so a stray dev .env can't change the listen port or which
      # relay the healthcheck probes.
      PORT: "3000"
      RELAY_HOST: relay
      RELAY_PORT: "8080"
    env_file: .env
    volumes:
      - app-data:/app/.data
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    build:
      context: .
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?Set NEXT_PUBLIC_RELAY_URL in .env (see docs/DEPLOY.md §2)}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, proxy-net]
    ulimits: *ulimits
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    environment:
      NODE_ENV: production
      RELAY_PORT: "8080"
    env_file: .env
    volumes:
      - app-data:/app/.data
    command: ["node", "dist-server/server/relay-node.js"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  coturn:
    # Optional TURN server for call media relay. Needs TURN_SECRET in .env:
    #   docker compose --profile turn up -d
    image: coturn/coturn@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    profiles: ["turn"]
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$TURN_SECRET" ]; then
          echo "TURN_SECRET not set — add it to .env before enabling the turn profile (see docs/DEPLOY.md)." >&2
          exit 1
        fi
        conf=$$(mktemp)
        cat > "$$conf" <<EOF
        use-auth-secret
        static-auth-secret=$$TURN_SECRET
        realm=relay
        no-cli
        min-port=49152
        max-port=49200
        log-file=stdout
        EOF
        chmod 600 "$$conf"
        exec turnserver -c "$$conf"

volumes:
  app-data:

networks:
  # Created once for a containerized reverse proxy: `docker network create proxy-net`
  proxy-net:
    external: true
